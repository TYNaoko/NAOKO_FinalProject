<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train Your Own Model</title>
  <script src="https://unpkg.com/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.5.0/dist/ml5.min.js"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }

    #start {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(#0a6cff, #5fdcff 70%, #3fe000 70%, #1c9e00);
    }

    #startBtn {
      cursor: pointer;
      font: bold 28px "Trebuchet MS", Verdana, sans-serif;
      color: #fff;
      padding: 16px 56px;
      border-radius: 14px;
      background: linear-gradient(#ffc400, #ff5200);
      border: 1px solid #b02e00;
      text-shadow: 0 1px 2px rgba(0,0,0,.45);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 4px 0 #b02e00, 0 7px 10px rgba(0,0,0,.25);
    }
    #startBtn:hover { filter: brightness(1.08); }
    #startBtn:active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 1px 0 #b02e00; }
  </style>
</head>
<body>
  <main></main>

  <div id="start">
    <button id="startBtn">Start</button>
  </div>

  <script>
    document.getElementById("startBtn").addEventListener("click", function () {
      document.getElementById("start").style.display = "none";
      var s = document.createElement("script");
      s.src = "FINALS_sketch.js";
      s.onload = function () { new p5(); };
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
